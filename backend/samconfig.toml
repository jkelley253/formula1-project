version = 0.1

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
stack_name = "formula1-backend"
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
s3_prefix = "formula1-backend"
parameter_overrides = "CorsAllowOrigin=\"*\""
image_repositories = []

[default.global.parameters]
region = "us-west-2"
