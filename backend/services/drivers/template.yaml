AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Formula 1 drivers microservice

Parameters:
  CorsAllowOrigin:
    Type: String
    Default: "*"
    Description: Origin allowed to call the public drivers API

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - !Ref CorsAllowOrigin
      AllowMethods:
        - GET
      AllowHeaders:
        - Content-Type

Resources:
  DriversApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  GetDriversFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../..
      Handler: drivers_service.handlers.api.lambda_handler
      Description: Returns the current Formula 1 driver standings
      Events:
        GetDrivers:
          Type: HttpApi
          Properties:
            ApiId: !Ref DriversApi
            Path: /api/drivers
            Method: GET

Outputs:
  DriversApiUrl:
    Description: Public driver standings endpoint
    Value: !Sub "https://${DriversApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/drivers"
