[project]
name = "formula1-lambda-common"
version = "0.1.0"
description = "Shared infrastructure helpers for Formula 1 Lambda services"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formula1_lambda_common"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
