[project]
name = "formula1-backend-workspace"
version = "0.1.0"
description = "Formula 1 serverless microservices workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["packages/*/tests", "services/*/tests"]
